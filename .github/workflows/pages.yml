name: Build and deploy site

on:
  push:
    branches: [branch2022]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          # Do not take the Bundler version from Gemfile.lock: that file may be
          # generated by an older system Ruby locally, and Bundler 1.x cannot
          # run on Ruby 3.x.
          bundler: latest
          bundler-cache: true

      - uses: actions/configure-pages@v5
        id: pages

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Check for broken internal links
        run: |
          bundle exec ruby script/check_links.rb

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
