# ---------------------------------------------------------------------------
# Site identity
# ---------------------------------------------------------------------------
title: Stochastic Path
tagline: Thoughts and feelings as we are making a virtual universe that mimics the natural selection.
description: >-
  Thoughts and feelings as we are making a virtual universe that mimics
  natural selection.
url: "https://www.aicracker.com"   # MUST include the scheme; canonical/OG/feed URLs depend on it
baseurl: ""

author:
  name: Lipeng Lai
  name_zh: 赖力鹏

github_username: umbriel47
linkedin_url: "https://www.linkedin.com/in/lipenglai/"

# WeChat official account. There is no URL that opens an account, so the entry
# point is a QR code the reader scans. `qr` was generated from `id` via
# https://open.weixin.qq.com/qr/code?username=<id> and is served locally rather
# than hot-linked, so no visitor IP reaches Tencent and the image cannot break.
wechat:
  name: "一目半"
  id: "gh_16d891c75cca"
  qr: /assets/img/wechat/yimuban-qr.jpg
  avatar: /assets/img/wechat/yimuban-avatar.png

# ---------------------------------------------------------------------------
# Languages
# ---------------------------------------------------------------------------
# `default_lang` is what the root redirect falls back to.
default_lang: en
languages: [en, zh]

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

permalink: /:year/:month/:day/:title/   # overridden per-language in `defaults` below

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

feed:
  path: feed.xml

# ---------------------------------------------------------------------------
# Analytics
# ---------------------------------------------------------------------------
# Cookieless, aggregate-only. Nothing is stored in the visitor's browser, so no
# consent banner is required. The script is loaded ONLY when JEKYLL_ENV is
# production, so local previews never reach the counter.
#
# provider: goatcounter | umami | cloudflare | ""   ("" disables analytics)
# site:     GoatCounter subdomain, Umami website id, or Cloudflare token
# host:     self-hosted instance, if any (Umami / GoatCounter)
analytics:
  provider: goatcounter
  site: "umbriel"     # https://umbriel.goatcounter.com
  host: ""

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - script
  - create_post.py
  - README.md
  - .bundle

# ---------------------------------------------------------------------------
# Collections
# ---------------------------------------------------------------------------
# Fiction chapters live in one collection per language so that the permalink
# prefix (/en/ or /zh/) can be set declaratively without leaking the language
# folder into `:path`.
collections:
  fictions_en:
    output: true
    permalink: /en/fictions/:path/
  fictions_zh:
    output: true
    permalink: /zh/fictions/:path/

# ---------------------------------------------------------------------------
# Front matter defaults
# ---------------------------------------------------------------------------
defaults:
  - scope: {path: "_posts/en", type: posts}
    values:
      lang: en
      locale: en_US
      layout: post
      permalink: /en/blog/:slug/
      categories: []
  - scope: {path: "_posts/zh", type: posts}
    values:
      lang: zh
      locale: zh_CN
      layout: post
      permalink: /zh/blog/:slug/
      categories: []
  - scope: {path: "", type: fictions_en}
    values: {lang: en, locale: en_US, layout: chapter}
  - scope: {path: "", type: fictions_zh}
    values: {lang: zh, locale: zh_CN, layout: chapter}
  - scope: {path: "en"}
    values: {lang: en, locale: en_US}
  - scope: {path: "zh"}
    values: {lang: zh, locale: zh_CN}
