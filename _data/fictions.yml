- slug: the-glass-garden
  status: ongoing        # ongoing | completed
  cover: /assets/img/fictions/the-glass-garden.svg
  title:
    en: "The Glass Garden"
    zh: "玻璃花园"
  blurb:
    en: >-
      A greenhouse on a mountain line, kept by a woman nobody sends for any
      more, and the passenger who gets off at the wrong stop to find it.
    zh: >-
      山线上的一座玻璃温室，一个再没有人来探望的守园人，
      以及一个下错了站、于是找到了它的旅客。

- slug: salt-and-signal
  status: completed
  cover: /assets/img/fictions/salt-and-signal.svg
  title:
    en: "Salt and Signal"
    zh: "盐与信号"
  blurb:
    en: >-
      Two weeks on a tidal flat, a radio that receives more than it should,
      and a family that has agreed not to talk about either.
    zh: >-
      潮间带上的两个星期，一台收到了不该收到的东西的收音机，
      以及一个约好了对这两件事都闭口不谈的家庭。
