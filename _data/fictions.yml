# Novels. Each is written in one language and is never translated, so `lang`
# says which language tree it lives under and `title`/`blurb` are plain strings
# in that language. Both /en/fictions/ and /zh/fictions/ list every novel.
#
# Each entry needs a `slug` that matches:
#   * the folder under _fictions_zh/ (or _fictions_en/) holding its chapters
#   * a detail page at <lang>/fictions/<slug>.md
#
# `volumes` is optional; when present the chapter list is grouped by it and a
# chapter's `volume:` front matter must name one of these keys.

- slug: chenbi
  lang: zh
  status: completed
  cover: /assets/img/fictions/chenbi.svg
  title: "沉璧 · 落雁洲七日"
  series: "验状录 · 第一部"
  blurb: >-
    一个不会武功的仵作，被请上一座被洪水围困的孤岛，为一具二十年前的白骨写验状；
    七日之内岛上死了三个人，而他手里唯一的兵器是一双看死人的眼睛。
  meta: "武侠推理长篇 · 本格 · 孤岛封闭圈 · 二十六章 · 约七万一千字"
  volumes:
    - key: v1
      title: "卷一 · 七月初一"
    - key: v2
      title: "卷二 · 七月初二"
    - key: v3
      title: "卷三 · 七月初三"
    - key: v4
      title: "卷四 · 七月初四"
    - key: v5
      title: "卷五 · 七月初五"
    - key: v6
      title: "卷六 · 七月初六"
    - key: v7
      title: "卷七 · 七月初七起"
