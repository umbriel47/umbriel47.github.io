# Publications, newest first (sorted by `year` at render time).
#
# Titles and abstracts are kept in English in both languages: a paper title is
# a citable string, and a translated one cannot be searched for. Only `venue`
# carries a per-language value; the surrounding UI comes from _data/i18n.yml.
#
# Generated from the Google Scholar profile; abstracts come from PubMed,
# Crossref, arXiv, bioRxiv and OpenReview.

- key: ocoo-t
  year: 2026
  authors: "D. Jiang, Z. An, Y. Zhao, L. Lai"
  title:
    en: "OCOO-T: A Simple and Scalable Virtual Cell Model for Transcriptional Perturbation Response Prediction"
    zh: "OCOO-T: A Simple and Scalable Virtual Cell Model for Transcriptional Perturbation Response Prediction"
  venue:
    en: "bioRxiv"
    zh: "bioRxiv"
  abstract:
    en: >-
      Predicting single-cell transcriptional responses to genetic, chemical
      and cytokine perturbations is a fundamental challenge in computational
      biology and AI Virtual Cell (AIVC) modeling, with direct implications
      for drug discovery and the elucidation of gene regulatory networks.
      Existing approaches often rely on auxiliary cell-state encoders,
      hierarchical variational autoencoders, dedicated Transformer
      encoder-decoder modules, or gene-interaction priors to compress
      high-dimensional expression profiles into latent representations. While
      effective, these designs increase architectural complexity and may limit
      scalability and generalizability. This paper introduces OCOO-T 1, a
      minimalist flow-matching-based AIVC model for transcriptional
      perturbation response prediction. OCOO-T utilizes a vanilla Transformer
      stack that operates directly on continuous gene expression profiles and
      formulates perturbation response prediction as a continuous-time
      denoising process. Perturbation embeddings, dosage information, and
      cell-line/cell-type specificity are integrated through adaptive layer
      normalization and in-context tokens. Comprehensive evaluations on
      Tahoe100M, Replogle, and PBMC benchmarks demonstrate that OCOO-T
      achieves state-of-the-art performance across diverse perturbations and
      cell types while effectively scaling to long transcriptional profiles
      through patching and depatching of cellular contexts. By leveraging the
      simplicity of Transformer-based denoising for single-cell omics, OCOO-T
      provides an effective and scalable framework for in-silico cellular
      simulation.
    zh: >-
      Predicting single-cell transcriptional responses to genetic, chemical
