  links:
    journal: "https://doi.org/10.1016/j.fct.2026.116131"

- key: attention-cell-image
  year: 2025
  authors: "X. Gao, F. Zhang, X. Guo, M. Yao, X. Wang, D. Chen, G. Zhang, X. Wang, L. Lai"
  title:
    en: "Attention-based deep learning for accurate cell image analysis"
    zh: "Attention-based deep learning for accurate cell image analysis"
  venue:
    en: "Scientific Reports 15, 1265"
    zh: "Scientific Reports 15, 1265"
  abstract:
    en: >-
      High-content analysis (HCA) holds enormous potential for drug discovery
      and research, but widely used methods can be cumbersome and yield
      inaccurate results. Noisy and redundant signals in cell images impede
      accurate deep learning-based image analysis. To address these issues, we
      introduce X-Profiler, a novel HCA method that combines cellular
      experiments, image processing, and deep learning modeling. X-Profiler
      combines the convolutional neural network and Transformer to encode
      high-content images, effectively filtering out noisy signals and
      precisely characterizing cell phenotypes. In comparative tests on
      drug-induced cardiotoxicity, mitochondrial toxicity classification, and
      compound classification, X-Profiler outperformed both DeepProfiler and
      CellProfiler, as two highly recognized and representative methods in
      this field. Our results demonstrate the utility and versatility of
      X-Profiler, and we anticipate its wide application in HCA for advancing
      drug development and disease research.
    zh: >-
      High-content analysis (HCA) holds enormous potential for drug discovery
