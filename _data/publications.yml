- key: rbc-stiffening
  year: 2015
  authors: "L. Lai, X. Xu, C. T. Lim, J. Cao"
  title:
    en: "Stiffening of red blood cells induced by cytoskeleton disorders: a joint theory-experiment study"
    zh: "Stiffening of red blood cells induced by cytoskeleton disorders: a joint theory-experiment study"
  venue:
    en: "Biophysical Journal 109(11), 2287-2294"
    zh: "Biophysical Journal 109(11), 2287-2294"
  abstract:
    en: >-
      The functions and elasticities of the cell are largely related to the
      structures of the cytoskeletons underlying the lipid bilayer. Among
      various cell types, the red blood cell (RBC) possesses a relatively
      simple cytoskeletal structure. Underneath the membrane, the RBC
      cytoskeleton takes the form of a two-dimensional triangular network,
      consisting of nodes of actins (and other proteins) and edges of
      spectrins. Recent experiments focusing on the malaria-infected RBCs
      (iRBCs) show that there is a correlation between the elongation of
      spectrins in the cytoskeletal network and the stiffening of the iRBCs.
      Here we rationalize the correlation between these two observations by
      combining the wormlike chain model for single spectrins and the
      effective medium theory for the network elasticity. We specifically
      focus on how the disorders in the cytoskeletal network affect its
      macroscopic elasticity. Analytical and numerical solutions from our
      model reveal that the stiffness of the membrane increases with
      increasing end-to-end distances of spectrins, but has a nonmonotonic
      dependence on the variance of the end-to-end distance distributions.
      These predictions are verified quantitatively by our atomic force
      microscopy and micropipette aspiration measurements of iRBCs. The model
      may, from a molecular level, provide guidelines for future
      identification of new treatment methods for RBC-related diseases, such
      as malaria infection.
    zh: >-
      The functions and elasticities of the cell are largely related to the
