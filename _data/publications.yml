  links:
    preprint: "http://arxiv.org/abs/1307.6420v1"

- key: malaria-cytoadherence
  year: 2013
  authors: "X. Xu, A. K. Efremov, A. Li, L. Lai, M. Dao, C. T. Lim, J. Cao"
  title:
    en: "Probing the cytoadherence of malaria infected red blood cells under flow"
    zh: "Probing the cytoadherence of malaria infected red blood cells under flow"
  venue:
    en: "PLoS ONE 8(5), e64763"
    zh: "PLoS ONE 8(5), e64763"
  abstract:
    en: >-
      Malaria is one of the most widespread and deadly human parasitic
      diseases caused by the Plasmodium (P.) species with the P. falciparum
      being the most deadly. The parasites are capable of invading red blood
      cells (RBCs) during infection. At the late stage of parasites'
      development, the parasites export proteins to the infected RBCs (iRBC)
      membrane and bind to receptors of surface proteins on the endothelial
      cells that line microvasculature walls. Resulting adhesion of iRBCs to
      microvasculature is one of the main sources of most complications during
      malaria infection. Therefore, it is important to develop a versatile and
      simple experimental method to quantitatively investigate iRBCs
      cytoadhesion and binding kinetics. Here, we developed an advanced flow
      based adhesion assay to demonstrate that iRBC's adhesion to endothelial
      CD36 receptor protein coated channels is a bistable process possessing a
      hysteresis loop. This finding confirms a recently developed model of
      cell adhesion which we used to fit our experimental data. We measured
      the contact area of iRBC under shear flow at different stages of
      infection using Total Internal Reflection Fluorescence (TIRF), and also
      adhesion receptor and ligand binding kinetics using Atomic Force
      Microscopy (AFM). With these parameters, we reproduced in our model the
      experimentally observed changes in adhesion properties of iRBCs
      accompanying parasite maturation and investigated the main mechanisms
      responsible for these changes, which are the contact area during the
      shear flow as well as the rupture area size.
    zh: >-
      Malaria is one of the most widespread and deadly human parasitic
      diseases caused by the Plasmodium (P.) species with the P. falciparum
