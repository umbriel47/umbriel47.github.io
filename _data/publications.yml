- key: sur2-vasodilator
  year: 2022
  authors: "D. Ding, J.-X. Wu, X. Duan, S. Ma, L. Lai, L. Chen"
  title:
    en: "Structural identification of vasodilator binding sites on the SUR2 subunit"
    zh: "Structural identification of vasodilator binding sites on the SUR2 subunit"
  venue:
    en: "Nature Communications 13, 2675"
    zh: "Nature Communications 13, 2675"
  abstract:
    en: >-
      ATP-sensitive potassium channels (KATP), composed of Kir6 and SUR
      subunits, convert the metabolic status of the cell into electrical
      signals. Pharmacological activation of SUR2-containing KATP channels by
      class of small molecule drugs known as KATP openers leads to
      hyperpolarization of excitable cells and to vasodilation. Thus, KATP
      openers could be used to treat cardiovascular diseases. However, where
      these vasodilators bind to KATP and how they activate the channel
      remains elusive. Here, we present cryo-EM structures of SUR2A and SUR2B
      subunits in complex with Mg-nucleotides and P1075 or levcromakalim, two
      chemically distinct KATP openers that are specific to SUR2. Both P1075
      and levcromakalim bind to a common site in the transmembrane domain
      (TMD) of the SUR2 subunit, which is between TMD1 and TMD2 and is
      embraced by TM10, TM11, TM12, TM14, and TM17. These KATP openers
      synergize with Mg-nucleotides to stabilize SUR2 in the NBD-dimerized
      occluded state to activate the channel.
    zh: >-
      ATP-sensitive potassium channels (KATP), composed of Kir6 and SUR
      subunits, convert the metabolic status of the cell into electrical
