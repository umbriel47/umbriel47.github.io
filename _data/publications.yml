  links:
    journal: "https://doi.org/10.1063/1.4758280"

- key: asymmetric-disconnection
  year: 2009
  authors: "K. S. Turitsyn, L. Lai, W. W. Zhang"
  title:
    en: "Asymmetric disconnection of an underwater air bubble: Persistent neck vibrations evolve into a smooth contact"
    zh: "Asymmetric disconnection of an underwater air bubble: Persistent neck vibrations evolve into a smooth contact"
  venue:
    en: "Physical Review Letters 103, 124501"
    zh: "Physical Review Letters 103, 124501"
  abstract:
    en: >-
      The disconnection of an underwater bubble illustrates how slight initial
      asymmetries can prevent the formation of a finite-time singularity.
      Creating a singularity by focusing a finite amount of energy dynamically
      into a vanishingly small amount of material requires that the initial
      condition be perfectly symmetric. In reality, imperfections are always
      present. We show a slight azimuthal asymmetry in the initial shape of
      the bubble neck excites vibrations that persist over time. As a result,
      the focusing singularity is generically preempted by a smooth contact.
    zh: >-
      The disconnection of an underwater bubble illustrates how slight initial
      asymmetries can prevent the formation of a finite-time singularity.
      Creating a singularity by focusing a finite amount of energy dynamically
