- key: ml-pbpk
  year: 2024
  authors: "Y. Li, Z. Wang, Y. Li, J. Du, X. Gao, Y. Li, L. Lai"
  title:
    en: "A combination of machine learning and PBPK modeling approach for pharmacokinetics prediction of small molecules in humans"
    zh: "A combination of machine learning and PBPK modeling approach for pharmacokinetics prediction of small molecules in humans"
  venue:
    en: "Pharmaceutical Research 41(7), 1369-1379"
    zh: "Pharmaceutical Research 41(7), 1369-1379"
  abstract:
    en: >-
      Purpose: Recently, there has been rapid development in model-informed
      drug development, which has the potential to reduce animal experiments
      and accelerate drug discovery. Physiologically based pharmacokinetic
      (PBPK) and machine learning (ML) models are commonly used in early drug
      discovery to predict drug properties. However, basic PBPK models require
      a large number of molecule-specific inputs from in vitro experiments,
      which hinders the efficiency and accuracy of these models. To address
      this issue, this paper introduces a new computational platform that
      combines ML and PBPK models. The platform predicts molecule PK profiles
      with high accuracy and without the need for experimental data. Methods:
      This study developed a whole-body PBPK model and ML models of plasma
      protein fraction unbound ($$f_{up}$$ f up), Caco-2 cell permeability,
      and total plasma clearance to predict the PK of small molecules after
      intravenous administration. Pharmacokinetic profiles were simulated
      using a “bottom-up” PBPK modeling approach with ML inputs. Additionally,
      40 compounds were used to evaluate the platform’s accuracy. Results:
      Results showed that the ML-PBPK model predicted the area under the
      concentration-time curve (AUC) with 65.0 $$\%$$ % accuracy within a
      2-fold range, which was higher than using in vitro inputs with 47.5
      $$\%$$ % accuracy. Conclusion: The ML-PBPK model platform provides high
      accuracy in prediction and reduces the number of experiments and time
      required compared to traditional PBPK approaches. The platform
      successfully predicts human PK parameters without in vitro and in vivo
      experiments and can potentially guide early drug discovery and
      development.
    zh: >-
      Purpose: Recently, there has been rapid development in model-informed
      drug development, which has the potential to reduce animal experiments
      and accelerate drug discovery. Physiologically based pharmacokinetic
      (PBPK) and machine learning (ML) models are commonly used in early drug
      discovery to predict drug properties. However, basic PBPK models require
      a large number of molecule-specific inputs from in vitro experiments,
      which hinders the efficiency and accuracy of these models. To address
      this issue, this paper introduces a new computational platform that
      combines ML and PBPK models. The platform predicts molecule PK profiles
      with high accuracy and without the need for experimental data. Methods:
      This study developed a whole-body PBPK model and ML models of plasma
      protein fraction unbound ($$f_{up}$$ f up), Caco-2 cell permeability,
      and total plasma clearance to predict the PK of small molecules after
      intravenous administration. Pharmacokinetic profiles were simulated
      using a “bottom-up” PBPK modeling approach with ML inputs. Additionally,
      40 compounds were used to evaluate the platform’s accuracy. Results:
      Results showed that the ML-PBPK model predicted the area under the
      concentration-time curve (AUC) with 65.0 $$\%$$ % accuracy within a
      2-fold range, which was higher than using in vitro inputs with 47.5
      $$\%$$ % accuracy. Conclusion: The ML-PBPK model platform provides high
      accuracy in prediction and reduces the number of experiments and time
      required compared to traditional PBPK approaches. The platform
      successfully predicts human PK parameters without in vitro and in vivo
      experiments and can potentially guide early drug discovery and
      development.
  links:
    journal: "https://doi.org/10.1007/s11095-024-03725-y"

- key: molecule-generation-platform
  year: 2024
  authors: "L. Zheng, F. Shi, C. Peng, M. Xu, F. Fan, Y. Li, L. Zhang, J. Du, Z. Wang, Z. Lin, et al."
  title:
    en: "Application scenario-oriented molecule generation platform developed for drug discovery"
    zh: "Application scenario-oriented molecule generation platform developed for drug discovery"
  venue:
    en: "Methods 222, 112-121"
    zh: "Methods 222, 112-121"
  abstract:
    en: >-
      Design of molecules for candidate compound selection is one of the
      central challenges in drug discovery due to the complexity of chemical
      space and requirement of multi-parameter optimization. Here we present
      an application scenario-oriented platform (ID4Idea) for molecule
      generation in different scenarios of drug discovery. This platform
      utilizes both library or rule based and generative based algorithms
      (VAE, RNN, GAN, etc.), in combination with various AI learning types
      (pre-training, transfer learning, reinforcement learning, active
      learning, etc.) and input representations (1D SMILES, 2D graph, 3D
      shape, binding site, pharmacophore, etc.), to enable customized
      solutions for a given molecular design scenario. Besides the usual
      generation followed screening protocol, goal-directed molecule
      generation can also be conducted towards predefined goals, enhancing the
      efficiency of hit identification, lead finding, and lead optimization.
      We demonstrate the effectiveness of ID4Idea platform through case
      studies, showcasing customized solutions for different design tasks
      using various input information, such as binding pockets,
      pharmacophores, and compound representations. In addition, remaining
      challenges are discussed to unlock the full potential of AI models in
      drug discovery and pave the way for the development of novel
      therapeutics.
