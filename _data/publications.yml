  links:
    preprint: "https://doi.org/10.1101/2025.08.08.669291"

- key: mrna2vec
  year: 2025
  authors: "H. Zhang, X. Gao, J. Zhang, L. Lai"
  title:
    en: "mRNA2vec: mRNA Embedding with Language Model in the 5'UTR-CDS for mRNA Design"
    zh: "mRNA2vec: mRNA Embedding with Language Model in the 5'UTR-CDS for mRNA Design"
  venue:
    en: "Proceedings of the AAAI Conference on Artificial Intelligence 39(1), 1057-1065"
    zh: "AAAI 2025, 39(1), 1057-1065"
  abstract:
    en: >-
      Messenger RNA (mRNA)-based vaccines are accelerating the discovery of
      new drugs and revolutionizing the pharmaceutical industry. However,
      selecting particular mRNA sequences for vaccines and therapeutics from
      extensive mRNA libraries is costly. Effective mRNA therapeutics require
      carefully designed sequences with optimized expression levels and
      stability. This paper proposes a novel contextual language model
      (LM)-based embedding method: mRNA2vec. In contrast to existing mRNA
      embedding approaches, our method is based on the self-supervised
      teacher-student learning framework of data2vec. We jointly use the 5'
      untranslated region (UTR) and coding sequence (CDS) region as the input
      sequences. We adapt our LM-based approach specifically to mRNA by 1)
      considering the importance of location on the mRNA sequence with
      probabilistic masking, 2) using Minimum Free Energy (MFE) prediction and
      Secondary Structure (SS) classification as additional pretext tasks.
      mRNA2vec demonstrates significant improvements in translation efficiency
      (TE) and expression level (EL) prediction tasks in UTR compared to SOTA
      methods such as UTR-LM. It also gives a competitive performance in mRNA
      stability and protein production level tasks in CDS such as CodonBERT.
    zh: >-
      Messenger RNA (mRNA)-based vaccines are accelerating the discovery of
