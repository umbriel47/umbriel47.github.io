      transformer with debiased ranking objectives to improve siRNA inhibition
      prediction and generalization. We evaluate our approach using two public
      datasets and one newly collected patent dataset. Our model demonstrates
      substantial improvement in Pearson correlation and strong performance
      across other metrics.
  links:
    preprint: "http://arxiv.org/abs/2509.15664v1"

- key: antibody-pretraining
  year: 2024
  authors: "X. Gao, C. Cao, C. He, L. Lai"
  title:
    en: "Pre-training with a rational approach for antibody sequence representation"
    zh: "Pre-training with a rational approach for antibody sequence representation"
  venue:
    en: "Frontiers in Immunology 15, 1468599"
    zh: "Frontiers in Immunology 15, 1468599"
  abstract:
    en: >-
      Introduction Antibodies represent a specific class of proteins produced
      by the adaptive immune system in response to pathogens. Mining the
      information embedded in antibody amino acid sequences can benefit both
      antibody property prediction and novel therapeutic development. However,
      antibodies possess unique features that should be incorporated using
      specifically designed training methods, leaving room for improvement in
      pre-training models for antibody sequences. Methods In this study, we
      present a Pre-trained model of Antibody sequences trained with a
      Rational Approach for antibodies (PARA). PARA employs a strategy
      conforming to antibody sequence patterns and an advanced natural
      language processing self-encoding model structure. This approach
      addresses the limitations of existing protein pre-training models, which
      primarily utilize language models without fully considering the
      differences between protein sequences and language sequences. Results We
      demonstrate PARA’s performance on several tasks by comparing it to
      various published pre-training models of antibodies. The results show
      that PARA significantly outperforms existing models on these tasks,
      suggesting that PARA has an advantage in capturing antibody sequence
      information. Discussion The antibody latent representation provided by
      PARA can substantially facilitate studies in relevant areas. We believe
      that PARA’s superior performance in capturing antibody sequence
      information offers significant potential for both antibody property
      prediction and the development of novel therapeutics. PARA is available
      at https://github.com/xtalpi-xic.
