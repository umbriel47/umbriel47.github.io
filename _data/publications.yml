- key: sc-mamba2
  year: 2024
  authors: "Y. Zhao, B. Zhao, F. Zhang, C. He, W. Wu, L. Lai"
  title:
    en: "Sc-mamba2: leveraging state-space models for efficient single-cell ultra-long transcriptome modeling"
    zh: "Sc-mamba2: leveraging state-space models for efficient single-cell ultra-long transcriptome modeling"
  venue:
    en: "bioRxiv"
    zh: "bioRxiv"
  abstract:
    en: >-
      AO_SCPLOWBSTRACTC_SCPLOWThe rapid advancement of single-cell sequencing
      technology has significantly deepened our understanding of cellular
      heterogeneity, yet it concurrently presents substantial challenges for
      the unified modeling of single-cell data. Simultaneously, pre-trained
      foundation models have achieved notable success in domains such as
      natural language processing and image analysis. However, extending these
      models to accommodate ultra-long single-cell transcriptome sequences,
      characterized by an extensive number of genes, remains a formidable
      task. In this study, we introduce SC-MAMBA2, based on the MAMBA2
      architecture, meticulously designed with a bidirectional modeling
      approach tailored for single-cell transcriptomics data. As the first
      single-cell foundation model to integrate state-space models (SSMs)
      underlying MAMBA2 architecture, SC-MAMBA2 features over 625 million
      parameters, covers more than 60,000 genes, and was pre-trained on a
      dataset of over 57 million cells, making it the most comprehensive
      solution for processing ultra-long transcriptome sequences. Extensive
      bench-marking across a diverse array of downstream tasks consistently
      demonstrates that SC-MAMBA2 surpasses state-of-the-art models,
      delivering superior accuracy and enhanced computational efficiency.
