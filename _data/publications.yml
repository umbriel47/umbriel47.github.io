  links:
    journal: "https://doi.org/10.1609/aaai.v39i1.32092"
    preprint: "http://arxiv.org/abs/2408.09048v2"

- key: sidpt
  year: 2025
  authors: "H. Zhang, X. Gao, L. Lai"
  title:
    en: "siDPT: siRNA efficacy prediction via debiased preference-pair transformer"
    zh: "siDPT: siRNA efficacy prediction via debiased preference-pair transformer"
  venue:
    en: "arXiv:2509.15664"
    zh: "arXiv:2509.15664"
  abstract:
    en: >-
      Small interfering RNA (siRNA) is a short double-stranded RNA molecule
      (about 21-23 nucleotides) with the potential to cure diseases by
      silencing the function of target genes. Due to its well-understood
      mechanism, many siRNA-based drugs have been evaluated in clinical
      trials. However, selecting effective binding regions and designing siRNA
      sequences requires extensive experimentation, making the process costly.
      As genomic resources and publicly available siRNA datasets continue to
      grow, data-driven models can be leveraged to better understand
      siRNA-mRNA interactions. To fully exploit such data, curating
      high-quality siRNA datasets is essential to minimize experimental errors
      and noise. We propose siDPT: siRNA efficacy Prediction via Debiased
      Preference-Pair Transformer, a framework that constructs a
      preference-pair dataset and designs an siRNA-mRNA interactive
      transformer with debiased ranking objectives to improve siRNA inhibition
      prediction and generalization. We evaluate our approach using two public
      datasets and one newly collected patent dataset. Our model demonstrates
      substantial improvement in Pearson correlation and strong performance
      across other metrics.
    zh: >-
      Small interfering RNA (siRNA) is a short double-stranded RNA molecule
