      synergize with Mg-nucleotides to stabilize SUR2 in the NBD-dimerized
      occluded state to activate the channel.
  links:
    journal: "https://doi.org/10.1038/s41467-022-30428-y"

- key: bayesopt-penicillin
  year: 2021
  authors: "Q. Liang, L. Lai"
  title:
    en: "Scalable Bayesian optimization accelerates process optimization of penicillin production"
    zh: "Scalable Bayesian optimization accelerates process optimization of penicillin production"
  venue:
    en: "NeurIPS 2021 AI for Science Workshop"
    zh: "NeurIPS 2021 AI for Science Workshop"
  abstract:
    en: >-
      While Bayesian Optimization (BO) has emerged as sample-efficient
      optimization method for accelerating drug discovery, it has rarely been
      applied to the process optimization of pharmaceutical manufacturing,
      which traditionally has relied on human-intuition, along with
      trial-and-error and slow cycles of learning. The combinatorial and
      hierarchical complexity of such process control also introduce
      challenges related to high-dimensional design spaces and requirements of
      larger scale observations, in which BO has typically scaled poorly. In
      this paper, we use penicillin production as a case study to demonstrate
      the efficacy of BO in accelerating the optimization of typical
      pharmaceutical manufacturing processes. To overcome the challenges
      raised by high dimensionality, we apply a trust region BO approach
      (TuRBO) for global optimization of penicillin yield and empirically show
      that it outperforms other BO and random baselines. We also extend the
      study by leveraging BO in the context of multi-objective optimization,
      allowing us to further evaluate the trade-offs between penicillin yield,
      production time, and CO$_2$ emission as by-product. Through quantifying
      the performance of BO across high-dimensional and multi-objective drug
      production optimization processes, we hope to popularize application of
      BO in this field, and encourage closer collaboration between machine
      learning and broader scientific communities.
