- key: sars-cov-2-affinity-maturation
  year: 2021
  authors: "T. Xue, W. Wu, N. Guo, C. Wu, J. Huang, L. Lai, H. Liu, Y. Li, T. Wang, Y. Wang"
  title:
    en: "Single point mutations can potentially enhance infectivity of SARS-CoV-2 revealed by in silico affinity maturation and SPR assay"
    zh: "Single point mutations can potentially enhance infectivity of SARS-CoV-2 revealed by in silico affinity maturation and SPR assay"
  venue:
    en: "RSC Advances 11(24), 14737-14745"
    zh: "RSC Advances 11(24), 14737-14745"
  abstract:
    en: >-
      The RBD (receptor binding domain) of the SARS-CoV-2 virus S (spike)
      protein mediates viral cell attachment and serves as a promising target
      for therapeutics development. Mutations on the S-RBD may alter its
      affinity to the cell receptor and affect the potency of vaccines and
      antibodies. Here we used an in silico approach to predict how mutations
      on RBD affect its binding affinity to hACE2 (human
      angiotensin-converting enzyme2). The effect of all single point
      mutations on the interface was predicted. SPR assay results show that 6
      out of 9 selected mutations can strengthen binding affinity. Our
      prediction has reasonable agreement with the previous deep mutational
      scan results and recently reported mutants. Our work demonstrated the in
      silico method as a powerful tool to forecast more powerful virus
      mutants, which will significantly benefit the development of broadly
      neutralizing vaccine and antibody.
    zh: >-
      The RBD (receptor binding domain) of the SARS-CoV-2 virus S (spike)
      protein mediates viral cell attachment and serves as a promising target
      for therapeutics development. Mutations on the S-RBD may alter its
      affinity to the cell receptor and affect the potency of vaccines and
      antibodies. Here we used an in silico approach to predict how mutations
      on RBD affect its binding affinity to hACE2 (human
      angiotensin-converting enzyme2). The effect of all single point
      mutations on the interface was predicted. SPR assay results show that 6
      out of 9 selected mutations can strengthen binding affinity. Our
      prediction has reasonable agreement with the previous deep mutational
      scan results and recently reported mutants. Our work demonstrated the in
      silico method as a powerful tool to forecast more powerful virus
      mutants, which will significantly benefit the development of broadly
      neutralizing vaccine and antibody.
  links:
    journal: "https://doi.org/10.1039/d1ra00426c"

- key: ellipsoid-diffusion
  year: 2016
  authors: "Y. Peng, L. Lai, Y.-S. Tai, K. Zhang, X. Xu, X. Cheng"
  title:
    en: "Diffusion of ellipsoids in bacterial suspensions"
    zh: "Diffusion of ellipsoids in bacterial suspensions"
  venue:
    en: "Physical Review Letters 116, 068303"
    zh: "Physical Review Letters 116, 068303"
  abstract:
    en: >-
      Active fluids such as swarming bacteria and motile colloids exhibit
      exotic properties different from conventional equilibrium materials. As
      a peculiar example, a spherical tracer immersed inside active fluids
      shows an enhanced translational diffusion, orders of magnitude stronger
      than its intrinsic Brownian motion. Here, rather than spherical tracers,
      we investigate the diffusion of isolated ellipsoids in a
      quasi-two-dimensional bacterial bath. Our study shows a nonlinear
      enhancement of both translational and rotational diffusions of
      ellipsoids. More importantly, we uncover an anomalous coupling between
      particles' translation and rotation that is strictly prohibited in
      Brownian diffusion. The coupling reveals a counterintuitive anisotropic
      particle diffusion, where an ellipsoid diffuses fastest along its minor
      axis in its body frame. Combining experiments with theoretical modeling,
      we show that such an anomalous diffusive behavior arises from the
      generic straining flow of swimming bacteria. Our work illustrates an
      unexpected feature of active fluids and deepens our understanding of
      transport processes in microbiological systems.
    zh: >-
      Active fluids such as swarming bacteria and motile colloids exhibit
