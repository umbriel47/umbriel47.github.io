  links:
    journal: "https://doi.org/10.1038/s41598-025-85608-9"
    preprint: "https://doi.org/10.21203/rs.3.rs-3933549/v1"

- key: bioscientist-agent
  year: 2025
  authors: "F. Zhang, Y. Zhao, W. Zhang, L. Lai"
  title:
    en: "BioScientist Agent: Designing LLM-Biomedical Agents with KG-Augmented RL Reasoning Modules for Drug Repurposing and Mechanistic of Action Elucidation"
    zh: "BioScientist Agent: Designing LLM-Biomedical Agents with KG-Augmented RL Reasoning Modules for Drug Repurposing and Mechanistic of Action Elucidation"
  venue:
    en: "bioRxiv"
    zh: "bioRxiv"
  abstract:
    en: >-
      Drug discovery is protracted, resource-intensive, and afflicted by
      attrition rates exceeding 90 %, which leaves most diseases, particularly
      rare or neglected indications, without effective therapies. Drug
      repurposing offers a cost effective alternative, yet systematic
      identification of novel drug indication pairs and mechanistic rationales
      remains hindered by the scale and heterogeneity of biomedical knowledge.
      We present BioScientist Agent, an end to end framework that unifies a
      billion-fact biomedical knowledge graph with (i) a variational graph
      auto-encoder for representation learning and link prediction driven drug
      repurposing, (ii) a reinforcement learning module that traverses the
      graph to recover biologically plausible mechanistic paths, and (iii) A
      large language model (LLM) multi-agent layer that orchestrates these
      components, enabling inference of target pathways for a drug disease
      pair, and automatic generation of coherent causal reports. In all
      downstream tasks, the BioScientist Agent surpasses existing state of the
      art baseline models across various metrics and provides mechanistic
      explanations consistent with the literature. Its open and modular design
      accelerates hypothesis generation and reduces experimental overhead in
      early stage discovery.
