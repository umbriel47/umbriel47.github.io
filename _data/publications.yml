    journal: "https://doi.org/10.1371/journal.pone.0064763"

- key: curvature-singularity
  year: 2012
  authors: "L. Lai"
  title:
    en: "Curvature singularity in the asymmetric breakup of an underwater air bubble"
    zh: "Curvature singularity in the asymmetric breakup of an underwater air bubble"
  venue:
    en: "Physics of Fluids 24(10)"
    zh: "Physics of Fluids 24(10)"
  abstract:
    en: >-
      The presence of slight azimuthal asymmetry in the initial shape of an
      underwater bubble entirely alters the final breakup dynamics. Here, I
      examine the influence of initial asymmetry on the final breakup by
      simulating the bubble surface evolution as a Hamiltonian evolution
      corresponding to an inviscid, two-dimensional, planar implosion. I find
      two types of breakups: a previously reported coalescence mode in which
      distant regions along the air-water surface curve inwards and eventually
      collide with finite speed, and a hitherto uncharacterized cusp-like mode
      where the surface develops sharp tips whose radii of curvature are much
      smaller than the average neck radius. I present three sets of results
      that characterize the nature of this cusp mode. First, I show that the
      cusp-like mode corresponds to a phase space trajectory that passes close
      to a saddle-node structure. In other words, an evolution towards a
      cross-section shape with sharp tips invariably later evolves away from
      it. In phase space, this saddle-node separates coalescence modes whose
      coalescence planes lie along different spatial orientations. Second, I
      show that the formation of the sharp tips can be interpreted as a weakly
      first-order transition which becomes second-order, corresponding to the
      formation of a finite-time curvature singularity, in the limit that the
      initial perturbation amplitude approaches zero. Third, I show that, as
      the curvature singularity is approached, the maximum surface curvature
      diverges approximately as (tc − t)−0.8, where tc is the onset time of
      the singularity and the maximum velocity diverges approximately as (tc −
      t)−0.4. In practice, these divergences imply that viscous drag and
      compressibility of the gas flow, two effects not included in my
      analysis, become significant as the interface evolves towards the
      curvature singularity.
    zh: >-
