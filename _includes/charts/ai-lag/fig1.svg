  <text x="313.8" y="295.0" font-size="13" text-anchor="middle" fill="#ffffff">+5</text>
  <text x="344.5" y="295.0" font-size="12" text-anchor="start" font-weight="400" fill="currentColor" fill-opacity=".6">1981 PC → 1995–2005 acceleration</text>
  <text x="176.0" y="393.0" font-size="14" text-anchor="end" font-weight="400" fill="currentColor" fill-opacity="1">AI (projected)</text>
  <rect x="190.0" y="368.0" width="60.0" height="40.0" fill="#c3bcee"/>
  <rect x="250.0" y="368.0" width="22.5" height="40.0" fill="#5b4fc4"/>
  <text x="220.0" y="393.0" font-size="14" text-anchor="middle" fill="#2b2560">8 years</text>
  <text x="261.2" y="393.0" font-size="13" text-anchor="middle" fill="#ffffff">+3</text>
  <text x="284.5" y="393.0" font-size="12" text-anchor="start" font-weight="400" fill="currentColor" fill-opacity=".6">2022 ChatGPT → 2032–2035 deployment</text>
  <line x1="190.0" y1="430.0" x2="940.0" y2="430.0" stroke="currentColor" stroke-opacity=".35" stroke-width="1"/>
  <line x1="190.0" y1="430.0" x2="190.0" y2="436.0" stroke="currentColor" stroke-opacity=".35" stroke-width="1"/>
  <text x="190.0" y="454.0" font-size="13" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity=".7">0</text>
  <line x1="340.0" y1="430.0" x2="340.0" y2="436.0" stroke="currentColor" stroke-opacity=".35" stroke-width="1"/>
  <text x="340.0" y="454.0" font-size="13" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity=".7">20</text>
  <line x1="490.0" y1="430.0" x2="490.0" y2="436.0" stroke="currentColor" stroke-opacity=".35" stroke-width="1"/>
  <text x="490.0" y="454.0" font-size="13" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity=".7">40</text>
  <line x1="640.0" y1="430.0" x2="640.0" y2="436.0" stroke="currentColor" stroke-opacity=".35" stroke-width="1"/>
  <text x="640.0" y="454.0" font-size="13" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity=".7">60</text>
  <line x1="790.0" y1="430.0" x2="790.0" y2="436.0" stroke="currentColor" stroke-opacity=".35" stroke-width="1"/>
  <text x="790.0" y="454.0" font-size="13" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity=".7">80</text>
  <line x1="940.0" y1="430.0" x2="940.0" y2="436.0" stroke="currentColor" stroke-opacity=".35" stroke-width="1"/>
  <text x="940.0" y="454.0" font-size="13" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity=".7">100</text>
  <text x="565.0" y="478.0" font-size="13" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity=".7">Years from commercialisation</text>
  <rect x="620.0" y="352.0" width="22.0" height="12.0" fill="#c3bcee"/>
  <text x="650.0" y="363.0" font-size="12" text-anchor="start" font-weight="400" fill="currentColor" fill-opacity=".75">Commercialisation → adoption threshold</text>
  <rect x="620.0" y="374.0" width="22.0" height="12.0" fill="#5b4fc4"/>
  <text x="650.0" y="385.0" font-size="12" text-anchor="start" font-weight="400" fill="currentColor" fill-opacity=".75">Adoption threshold → productivity visible</text>
</svg>
