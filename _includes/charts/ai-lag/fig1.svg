<svg class="chart" viewBox="0 0 1080 510" role="img" aria-label="Bar chart of the lag from commercialisation to measured productivity for steam, electricity, IT and AI" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <title>Bar chart of the lag from commercialisation to measured productivity for steam, electricity, IT and AI</title>
  <text x="150.0" y="34.0" font-size="17" text-anchor="start" font-weight="600" fill="currentColor" fill-opacity="1">Three industrial revolutions and AI: the lag from commercialisation to broad adoption and measured productivity</text>
  <text x="176.0" y="99.0" font-size="14" text-anchor="end" font-weight="400" fill="currentColor" fill-opacity="1">Steam (UK)</text>
  <rect x="190.0" y="74.0" width="405.0" height="40.0" fill="#c3bcee"/>
  <rect x="595.0" y="74.0" width="187.5" height="40.0" fill="#5b4fc4"/>
  <text x="392.5" y="99.0" font-size="14" text-anchor="middle" fill="#2b2560">54 years</text>
  <text x="688.8" y="99.0" font-size="13" text-anchor="middle" fill="#ffffff">+25</text>
  <text x="794.5" y="99.0" font-size="12" text-anchor="start" font-weight="400" fill="currentColor" fill-opacity=".6">1776 Watt engine → 1850–1870 peak</text>
  <text x="176.0" y="197.0" font-size="14" text-anchor="end" font-weight="400" fill="currentColor" fill-opacity="1">Electricity (US)</text>
  <rect x="190.0" y="172.0" width="277.5" height="40.0" fill="#c3bcee"/>
  <rect x="467.5" y="172.0" width="45.0" height="40.0" fill="#5b4fc4"/>
  <text x="328.8" y="197.0" font-size="14" text-anchor="middle" fill="#2b2560">37 years</text>
  <text x="490.0" y="197.0" font-size="13" text-anchor="middle" fill="#ffffff">+6</text>
  <text x="524.5" y="197.0" font-size="12" text-anchor="start" font-weight="400" fill="currentColor" fill-opacity=".6">1882 Pearl Street → 1920s jump</text>
  <text x="176.0" y="295.0" font-size="14" text-anchor="end" font-weight="400" fill="currentColor" fill-opacity="1">IT (US)</text>
  <rect x="190.0" y="270.0" width="105.0" height="40.0" fill="#c3bcee"/>
  <rect x="295.0" y="270.0" width="37.5" height="40.0" fill="#5b4fc4"/>
