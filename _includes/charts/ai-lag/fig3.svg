<svg class="chart" viewBox="0 0 1080 560" role="img" aria-label="Bar chart of the return on investment in a spinning jenny in Britain, France and India" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <title>Bar chart of the return on investment in a spinning jenny in Britain, France and India</title>
  <text x="120.0" y="36.0" font-size="17" text-anchor="start" font-weight="600" fill="currentColor" fill-opacity="1">The same machine, different factor prices (Allen 2009)</text>
  <text x="160.0" y="74.0" font-size="13" text-anchor="start" font-weight="400" fill="currentColor" fill-opacity=".6">Britain ~20,000 jennies by 1788; France ~900 by 1790; India 0</text>
  <line x1="140.0" y1="470.0" x2="1030.0" y2="470.0" stroke="currentColor" stroke-opacity=".08" stroke-width="1"/>
