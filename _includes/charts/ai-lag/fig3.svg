  <text x="288.3" y="500.0" font-size="15" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity="1">Britain</text>
  <rect x="495.0" y="340.8" width="180.0" height="61.2" fill="#c08419"/>
  <text x="585.0" y="328.8" font-size="15" text-anchor="middle" font-weight="600" fill="currentColor" fill-opacity="1">≈9%</text>
  <text x="585.0" y="500.0" font-size="15" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity="1">France</text>
  <rect x="791.7" y="402.0" width="180.0" height="23.8" fill="#d95f2b"/>
  <text x="881.7" y="451.8" font-size="15" text-anchor="middle" font-weight="600" fill="currentColor" fill-opacity="1">negative</text>
  <text x="881.7" y="500.0" font-size="15" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity="1">India</text>
  <text x="28.0" y="290.0" font-size="13" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity=".75" transform="rotate(-90 28 290)">Return on investment in a spinning jenny (%)</text>
