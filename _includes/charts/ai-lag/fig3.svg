  <line x1="140.0" y1="198.0" x2="1030.0" y2="198.0" stroke="currentColor" stroke-opacity=".08" stroke-width="1"/>
  <text x="128.0" y="203.0" font-size="13" text-anchor="end" font-weight="400" fill="currentColor" fill-opacity=".7">30</text>
  <line x1="140.0" y1="130.0" x2="1030.0" y2="130.0" stroke="currentColor" stroke-opacity=".08" stroke-width="1"/>
  <text x="128.0" y="135.0" font-size="13" text-anchor="end" font-weight="400" fill="currentColor" fill-opacity=".7">40</text>
  <line x1="140.0" y1="402.0" x2="1030.0" y2="402.0" stroke="currentColor" stroke-opacity=".45" stroke-width="1"/>
  <rect x="198.3" y="143.6" width="180.0" height="258.4" fill="#17a07a"/>
