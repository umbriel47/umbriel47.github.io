<svg class="chart" viewBox="0 0 1080 560" role="img" aria-label="Bar chart of the share of US firms using AI, by firm size and sector" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif">
