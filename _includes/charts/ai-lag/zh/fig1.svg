  <text x="940.0" y="454.0" font-size="13" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity=".7">100</text>
  <text x="565.0" y="478.0" font-size="13" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity=".7">自商业化起点起的年数</text>
  <rect x="620.0" y="352.0" width="22.0" height="12.0" fill="#c3bcee"/>
  <text x="650.0" y="363.0" font-size="12" text-anchor="start" font-weight="400" fill="currentColor" fill-opacity=".75">商业化 → 采用临界</text>
  <rect x="620.0" y="374.0" width="22.0" height="12.0" fill="#5b4fc4"/>
  <text x="650.0" y="385.0" font-size="12" text-anchor="start" font-weight="400" fill="currentColor" fill-opacity=".75">采用临界 → 生产率显现</text>
