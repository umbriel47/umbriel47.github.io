  <text x="688.8" y="99.0" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff" fill-opacity="1">+25</text>
  <text x="794.5" y="99.0" font-size="12" text-anchor="start" font-weight="400" fill="currentColor" fill-opacity=".6">1776 首台商用瓦特机 → 1850–1870 贡献峰值</text>
  <text x="176.0" y="197.0" font-size="14" text-anchor="end" font-weight="400" fill="currentColor" fill-opacity="1">电力（美国）</text>
  <rect x="190.0" y="172.0" width="277.5" height="40.0" fill="#c3bcee"/>
  <rect x="467.5" y="172.0" width="45.0" height="40.0" fill="#5b4fc4"/>
