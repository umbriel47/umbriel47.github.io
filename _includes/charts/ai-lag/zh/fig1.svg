  <text x="490.0" y="197.0" font-size="13" text-anchor="middle" font-weight="400" fill="#ffffff" fill-opacity="1">+6</text>
  <text x="524.5" y="197.0" font-size="12" text-anchor="start" font-weight="400" fill="currentColor" fill-opacity=".6">1882 珍珠街 → 1920s 生产率跃升</text>
