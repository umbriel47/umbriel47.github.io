<svg class="chart" viewBox="0 0 1080 510" role="img" aria-label="三次工业革命与 AI：从商业化到广泛采用与生产率显现的迟滞" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>三次工业革命与 AI：从商业化到广泛采用与生产率显现的迟滞</title>
  <text x="150.0" y="34.0" font-size="17" text-anchor="start" font-weight="600" fill="currentColor" fill-opacity="1">三次工业革命与 AI：从商业化到广泛采用与生产率显现的迟滞</text>
  <text x="176.0" y="99.0" font-size="14" text-anchor="end" font-weight="400" fill="currentColor" fill-opacity="1">蒸汽（英国）</text>
  <rect x="190.0" y="74.0" width="405.0" height="40.0" fill="#c3bcee"/>
