<svg class="chart" viewBox="0 0 1080 840" role="img" aria-label="The AI infrastructure layers of belief-flow decisions" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>The AI infrastructure layers of belief-flow decisions</title>
  <rect x="60.0" y="60.0" width="760.0" height="118.0" rx="12" style="fill: var(--bg, #fff)"/>
  <rect x="60.0" y="60.0" width="760.0" height="118.0" rx="12" fill="#5b4fc4" fill-opacity=".06" stroke="#b3abf0" stroke-width="2"/>
  <text x="96.0" y="110.0" font-size="24" text-anchor="start" font-weight="700" fill="currentColor" fill-opacity="1">Interaction layer</text>
  <text x="96.0" y="146.0" font-size="16" text-anchor="start" font-weight="400" fill="currentColor" fill-opacity=".85">Belief distributions, why they changed, distance to the boundaries,</text>
  <text x="96.0" y="168.0" font-size="16" text-anchor="start" font-weight="400" fill="currentColor" fill-opacity=".85">and the information most worth getting next</text>
  <line x1="440.0" y1="202.0" x2="440.0" y2="184.0" stroke="currentColor" stroke-opacity="1" stroke-width="2"/>
  <path d="M0 0 L-14 -7 L-14 7 Z" fill="currentColor" transform="translate(440.0 182.0) rotate(-90)"/>
  <rect x="60.0" y="204.0" width="760.0" height="118.0" rx="12" style="fill: var(--bg, #fff)"/>
  <rect x="60.0" y="204.0" width="760.0" height="118.0" rx="12" fill="#5b4fc4" fill-opacity=".06" stroke="#b3abf0" stroke-width="2"/>
  <text x="96.0" y="254.0" font-size="24" text-anchor="start" font-weight="700" fill="currentColor" fill-opacity="1">Audit &amp; access layer</text>
  <text x="96.0" y="290.0" font-size="16" text-anchor="start" font-weight="400" fill="currentColor" fill-opacity=".85">Versioning, decision log, post-hoc calibration; access rights and</text>
  <text x="96.0" y="312.0" font-size="16" text-anchor="start" font-weight="400" fill="currentColor" fill-opacity=".85">separation of blinded and partner data</text>
  <line x1="440.0" y1="346.0" x2="440.0" y2="328.0" stroke="currentColor" stroke-opacity="1" stroke-width="2"/>
  <path d="M0 0 L-14 -7 L-14 7 Z" fill="currentColor" transform="translate(440.0 326.0) rotate(-90)"/>
  <rect x="60.0" y="348.0" width="760.0" height="118.0" rx="12" style="fill: var(--bg, #fff)"/>
  <rect x="60.0" y="348.0" width="760.0" height="118.0" rx="12" fill="#5b4fc4" fill-opacity=".14" stroke="#b3abf0" stroke-width="2"/>
  <text class="accent-text" x="96.0" y="398.0" font-size="24" text-anchor="start" font-weight="700" fill="#5b4fc4" fill-opacity="1">Decision layer</text>
  <text x="96.0" y="434.0" font-size="16" text-anchor="start" font-weight="400" fill="currentColor" fill-opacity=".85">Expected value of each action, value-of-information engine, portfolio</text>
  <text x="96.0" y="456.0" font-size="16" text-anchor="start" font-weight="400" fill="currentColor" fill-opacity=".85">allocation and boundary triggers</text>
  <line x1="440.0" y1="490.0" x2="440.0" y2="472.0" stroke="currentColor" stroke-opacity="1" stroke-width="2"/>
  <path d="M0 0 L-14 -7 L-14 7 Z" fill="currentColor" transform="translate(440.0 470.0) rotate(-90)"/>
  <rect x="60.0" y="492.0" width="760.0" height="118.0" rx="12" style="fill: var(--bg, #fff)"/>
  <rect x="60.0" y="492.0" width="760.0" height="118.0" rx="12" fill="#5b4fc4" fill-opacity=".06" stroke="#b3abf0" stroke-width="2"/>
  <text x="96.0" y="542.0" font-size="24" text-anchor="start" font-weight="700" fill="currentColor" fill-opacity="1">Model layer</text>
  <text x="96.0" y="578.0" font-size="16" text-anchor="start" font-weight="400" fill="currentColor" fill-opacity=".85">Hierarchical Bayesian priors and dynamic borrowing, PK/PD and</text>
  <text x="96.0" y="600.0" font-size="16" text-anchor="start" font-weight="400" fill="currentColor" fill-opacity=".85">disease-progression models, success-rate prediction</text>
  <line x1="440.0" y1="634.0" x2="440.0" y2="616.0" stroke="currentColor" stroke-opacity="1" stroke-width="2"/>
  <path d="M0 0 L-14 -7 L-14 7 Z" fill="currentColor" transform="translate(440.0 614.0) rotate(-90)"/>
  <rect x="60.0" y="636.0" width="760.0" height="118.0" rx="12" style="fill: var(--bg, #fff)"/>
  <rect x="60.0" y="636.0" width="760.0" height="118.0" rx="12" fill="#5b4fc4" fill-opacity=".06" stroke="#b3abf0" stroke-width="2"/>
  <text x="96.0" y="686.0" font-size="24" text-anchor="start" font-weight="700" fill="currentColor" fill-opacity="1">Data layer</text>
  <text x="96.0" y="722.0" font-size="16" text-anchor="start" font-weight="400" fill="currentColor" fill-opacity=".85">Unified evidence graph: in-house experiments, clinical operations, safety,</text>
  <text x="96.0" y="744.0" font-size="16" text-anchor="start" font-weight="400" fill="currentColor" fill-opacity=".85">real-world data, competitors and literature</text>
  <rect x="860.0" y="60.0" width="180.0" height="694.0" rx="16" style="fill: var(--bg, #fff)"/>
  <rect x="860.0" y="60.0" width="180.0" height="694.0" rx="16" fill="#5b4fc4" fill-opacity=".04" stroke="#5b4fc4" stroke-width="3"/>
  <text class="accent-text" x="950.0" y="140.0" font-size="19" text-anchor="middle" font-weight="700" fill="#5b4fc4" fill-opacity="1">Decision makers</text>
  <text x="950.0" y="242.0" font-size="16" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity="1">Define the</text>
  <text x="950.0" y="263.0" font-size="16" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity="1">value function</text>
  <text x="950.0" y="318.0" font-size="16" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity="1">Set the</text>
  <text x="950.0" y="339.0" font-size="16" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity="1">charter limits</text>
  <text x="950.0" y="394.0" font-size="16" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity="1">Approve actions</text>
  <text x="950.0" y="415.0" font-size="16" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity="1">past the limits</text>
  <text x="950.0" y="470.0" font-size="16" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity="1">Judge what the</text>
  <text x="950.0" y="491.0" font-size="16" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity="1">model leaves out</text>
  <line x1="826.0" y1="119.0" x2="846.0" y2="119.0" stroke="#5b4fc4" stroke-opacity="1" stroke-width="2.5"/>
  <path d="M0 0 L-14 -7 L-14 7 Z" fill="#5b4fc4" transform="translate(858.0 119.0) rotate(0)"/>
  <line x1="858.0" y1="407.0" x2="826.0" y2="407.0" stroke="#5b4fc4" stroke-opacity="1" stroke-width="2.5"/>
  <path d="M0 0 L-14 -7 L-14 7 Z" fill="#5b4fc4" transform="translate(822.0 407.0) rotate(180)"/>
  <text x="60.0" y="796.0" font-size="15" text-anchor="start" font-weight="400" fill="currentColor" fill-opacity=".55">Data flows upwards; decision makers constrain the decision layer through the charter and value function,</text>
  <text x="60.0" y="818.0" font-size="15" text-anchor="start" font-weight="400" fill="currentColor" fill-opacity=".55">and get information through the interaction layer</text>
</svg>
