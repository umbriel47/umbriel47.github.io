<svg class="chart" viewBox="0 0 1080 620" role="img" aria-label="Mechanism versus constraint: on the left, a directed flow that fixes the steps and the direction; on the right, a boundary that cuts most of the possible solutions away, leaving only a small reachable region" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>Mechanism versus constraint: on the left, a directed flow that fixes the steps and the direction; on the right, a boundary that cuts most of the possible solutions away, leaving only a small reachable region</title>
  <text x="270" y="110" font-size="34" text-anchor="middle" font-weight="700" fill="currentColor" fill-opacity="1">Mechanism</text>
  <text x="810" y="110" font-size="34" text-anchor="middle" font-weight="700" fill="currentColor" fill-opacity="1">Constraint</text>
  <line x1="540" y1="50" x2="540" y2="570" stroke="#5b4fc4" stroke-opacity=".6" stroke-width="2.5" stroke-dasharray="8 8"/>
  <rect x="30" y="270" width="120" height="84" rx="14" style="fill: var(--bg, #fff)" stroke="#5b4fc4" stroke-opacity="1" stroke-width="3"/>
  <text x="90" y="321" font-size="26" text-anchor="middle" font-weight="700" fill="currentColor" fill-opacity="1">DNA</text>
  <rect x="210" y="270" width="120" height="84" rx="14" style="fill: var(--bg, #fff)" stroke="#5b4fc4" stroke-opacity="1" stroke-width="3"/>
  <text x="270" y="321" font-size="26" text-anchor="middle" font-weight="700" fill="currentColor" fill-opacity="1">RNA</text>
  <line x1="154" y1="312" x2="192" y2="312" stroke="currentColor" stroke-opacity="1" stroke-width="3"/>
  <path d="M0 0 L-22 -12 L-22 12 Z" fill="currentColor" transform="translate(206 312) rotate(0)"/>
  <rect x="390" y="270" width="120" height="84" rx="14" fill="#5b4fc4" fill-opacity="1" stroke="#5b4fc4" stroke-opacity="1" stroke-width="3"/>
  <text x="450" y="321" font-size="26" text-anchor="middle" font-weight="700" fill="#fff" fill-opacity="1">Protein</text>
  <line x1="334" y1="312" x2="372" y2="312" stroke="currentColor" stroke-opacity="1" stroke-width="3"/>
  <path d="M0 0 L-22 -12 L-22 12 Z" fill="currentColor" transform="translate(386 312) rotate(0)"/>
  <text x="270" y="430" font-size="24" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity="1">Fixes the steps and the direction</text>
  <ellipse cx="810" cy="320" rx="230" ry="170" fill="#5b4fc4" fill-opacity=".18" stroke="#5b4fc4" stroke-opacity=".55" stroke-width="3"/>
  <text x="810" y="222" font-size="24" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity="1">Possible solutions</text>
  <line x1="640" y1="300" x2="762" y2="346" stroke="#5b4fc4" stroke-opacity="1" stroke-width="3.5"/>
  <path d="M0 0 L-24 -13 L-24 13 Z" fill="#5b4fc4" transform="translate(782 354) rotate(21)"/>
  <rect x="790" y="320" width="190" height="86" rx="12" style="fill: var(--bg, #fff)" stroke="#5b4fc4" stroke-opacity="1" stroke-width="4"/>
  <text class="accent-text" x="885" y="357" font-size="22" text-anchor="middle" font-weight="700" fill="#5b4fc4" fill-opacity="1">States still</text>
  <text class="accent-text" x="885" y="383" font-size="22" text-anchor="middle" font-weight="700" fill="#5b4fc4" fill-opacity="1">reachable</text>
  <text x="810" y="545" font-size="24" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity="1">Cuts down what can be reached</text>
