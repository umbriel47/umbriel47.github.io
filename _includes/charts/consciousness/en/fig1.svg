<svg class="chart" viewBox="0 0 1080 700" role="img" aria-label="Two two-layer pictures of reality: Laszlo's unobservable A dimension underlies the manifest M dimension; Glattfelder (2019) takes information as the base, with physical structure and subjective experience as its outer and inner faces" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>Two two-layer pictures of reality: Laszlo's unobservable A dimension underlies the manifest M dimension; Glattfelder (2019) takes information as the base, with physical structure and subjective experience as its outer and inner faces</title>
  <line x1="540" y1="40" x2="540" y2="660" stroke="#5b4fc4" stroke-opacity=".55" stroke-width="2.5" stroke-dasharray="8 8"/>
  <text x="270" y="78" font-size="36" text-anchor="middle" font-weight="700" fill="currentColor" fill-opacity="1">Laszlo</text>
  <text class="accent-text" x="270" y="114" font-size="21" text-anchor="middle" font-weight="400" fill="#5b4fc4" fill-opacity="1">Akashic paradigm (2004–2016)</text>
  <rect x="60" y="160" width="420" height="150" rx="14" style="fill: var(--bg, #fff)" stroke="#5b4fc4" stroke-opacity="1" stroke-width="3"/>
  <text x="270" y="220" font-size="23" text-anchor="middle" font-weight="700" fill="currentColor" fill-opacity="1">M dimension: the manifest world</text>
  <text x="270" y="262" font-size="20" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity="1">Particles, galaxies, life, brains</text>
  <line x1="230" y1="430" x2="230" y2="330" stroke="#5b4fc4" stroke-opacity="1" stroke-width="3"/>
  <path d="M0 0 L-22 -12 L-22 12 Z" fill="#5b4fc4" transform="translate(230 312) rotate(-90)"/>
  <line x1="310" y1="322" x2="310" y2="422" stroke="#5b4fc4" stroke-opacity="1" stroke-width="3"/>
  <path d="M0 0 L-22 -12 L-22 12 Z" fill="#5b4fc4" transform="translate(310 440) rotate(90)"/>
  <text x="328" y="368" font-size="20" text-anchor="start" font-weight="400" fill="currentColor" fill-opacity="1">Manifestation</text>
  <text x="328" y="398" font-size="20" text-anchor="start" font-weight="400" fill="currentColor" fill-opacity="1">and “memory”</text>
  <rect x="60" y="440" width="420" height="170" rx="14" fill="#5b4fc4" fill-opacity="1" stroke="#5b4fc4" stroke-opacity="1" stroke-width="0"/>
  <text x="270" y="503" font-size="25" text-anchor="middle" font-weight="700" fill="#fff" fill-opacity="1">A dimension: the Akasha</text>
  <text x="270" y="546" font-size="18" text-anchor="middle" font-weight="400" fill="#fff" fill-opacity="1">An unobservable, deep information field</text>
  <text x="270" y="576" font-size="18" text-anchor="middle" font-weight="400" fill="#fff" fill-opacity="1">(equated with the quantum vacuum)</text>
  <text x="810" y="78" font-size="36" text-anchor="middle" font-weight="700" fill="currentColor" fill-opacity="1">Glattfelder</text>
  <text class="accent-text" x="810" y="114" font-size="21" text-anchor="middle" font-weight="400" fill="#5b4fc4" fill-opacity="1">Information ontology (2019)</text>
  <rect x="600" y="160" width="190" height="150" rx="14" style="fill: var(--bg, #fff)" stroke="#5b4fc4" stroke-opacity="1" stroke-width="3"/>
  <text x="695" y="220" font-size="23" text-anchor="middle" font-weight="700" fill="currentColor" fill-opacity="1">Outer face</text>
  <text x="695" y="262" font-size="17" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity="1">Physical structure</text>
  <rect x="830" y="160" width="190" height="150" rx="14" style="fill: var(--bg, #fff)" stroke="#5b4fc4" stroke-opacity="1" stroke-width="3"/>
  <text x="925" y="220" font-size="23" text-anchor="middle" font-weight="700" fill="currentColor" fill-opacity="1">Inner face</text>
  <text x="925" y="262" font-size="17" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity="1">Subjective experience</text>
  <line x1="740" y1="430" x2="698" y2="330" stroke="#5b4fc4" stroke-opacity="1" stroke-width="3"/>
  <path d="M0 0 L-22 -12 L-22 12 Z" fill="#5b4fc4" transform="translate(690 312) rotate(-112)"/>
  <line x1="880" y1="430" x2="918" y2="330" stroke="#5b4fc4" stroke-opacity="1" stroke-width="3"/>
  <path d="M0 0 L-22 -12 L-22 12 Z" fill="#5b4fc4" transform="translate(925 312) rotate(-69)"/>
  <rect x="600" y="440" width="420" height="170" rx="14" fill="#5b4fc4" fill-opacity="1" stroke="#5b4fc4" stroke-opacity="1" stroke-width="0"/>
  <text x="810" y="513" font-size="30" text-anchor="middle" font-weight="700" fill="#fff" fill-opacity="1">Information</text>
  <text x="810" y="560" font-size="21" text-anchor="middle" font-weight="400" fill="#fff" fill-opacity="1">“Only information exists”</text>
</svg>
