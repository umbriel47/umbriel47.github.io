<svg class="chart" viewBox="0 0 1080 720" role="img" aria-label="Where consciousness sits in reality: the spectrum from physicalism to idealism, with the rough positions of Laszlo, Glattfelder and Kastrup, and under each position the main explanatory price it has to pay" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>Where consciousness sits in reality: the spectrum from physicalism to idealism, with the rough positions of Laszlo, Glattfelder and Kastrup, and under each position the main explanatory price it has to pay</title>
  <text x="540" y="60" font-size="27" text-anchor="middle" font-weight="700" fill="currentColor" fill-opacity="1">What is most fundamental?</text>
  <text x="70" y="140" font-size="22" text-anchor="start" font-weight="700" fill="currentColor" fill-opacity="1">Matter</text>
  <text x="1010" y="140" font-size="22" text-anchor="end" font-weight="700" fill="currentColor" fill-opacity="1">Mind / consciousness</text>
  <line x1="60" y1="250" x2="990" y2="250" stroke="currentColor" stroke-opacity="1" stroke-width="3"/>
  <path d="M0 0 L-30 -16 L-30 16 Z" fill="currentColor" transform="translate(70 250) rotate(0)"/>
  <path d="M0 0 L-30 -16 L-30 16 Z" fill="currentColor" transform="translate(1012 250) rotate(0)"/>
  <text x="150" y="207" font-size="21" text-anchor="middle" font-weight="700" fill="currentColor" fill-opacity="1">Physicalism</text>
  <circle cx="150" cy="250" r="16" fill="currentColor"/>
  <text x="390" y="207" font-size="21" text-anchor="middle" font-weight="700" fill="currentColor" fill-opacity="1">Dual-aspect monism</text>
  <circle cx="390" cy="250" r="16" fill="#8b80e6"/>
  <text x="620" y="207" font-size="21" text-anchor="middle" font-weight="700" fill="currentColor" fill-opacity="1">Panpsychism</text>
  <circle cx="620" cy="250" r="16" fill="#8b80e6"/>
  <text x="900" y="207" font-size="21" text-anchor="middle" font-weight="700" fill="currentColor" fill-opacity="1">Idealism</text>
  <circle cx="900" cy="250" r="16" fill="#5b4fc4"/>
  <rect x="295" y="290" width="190" height="56" rx="28" style="fill: var(--bg, #fff)" stroke="#5b4fc4" stroke-opacity="1" stroke-width="3"/>
  <text class="accent-text" x="390" y="325" font-size="18" text-anchor="middle" font-weight="700" fill="#5b4fc4" fill-opacity="1">Glattfelder 2019</text>
  <line x1="485" y1="318" x2="740" y2="318" stroke="#5b4fc4" stroke-opacity="1" stroke-width="3" stroke-dasharray="8 8"/>
  <path d="M0 0 L-22 -12 L-22 12 Z" fill="#5b4fc4" transform="translate(764 318) rotate(0)"/>
  <rect x="770" y="290" width="260" height="56" rx="28" style="fill: var(--bg, #fff)" stroke="#5b4fc4" stroke-opacity="1" stroke-width="3"/>
  <text class="accent-text" x="900" y="325" font-size="18" text-anchor="middle" font-weight="700" fill="#5b4fc4" fill-opacity="1">Glattfelder 2025</text>
  <rect x="770" y="358" width="260" height="56" rx="28" style="fill: var(--bg, #fff)" stroke="#5b4fc4" stroke-opacity="1" stroke-width="3"/>
  <text class="accent-text" x="900" y="393" font-size="18" text-anchor="middle" font-weight="700" fill="#5b4fc4" fill-opacity="1">Kastrup's analytic idealism</text>
  <rect x="770" y="426" width="260" height="56" rx="28" style="fill: var(--bg, #fff)" stroke="#5b4fc4" stroke-opacity="1" stroke-width="3"/>
  <text class="accent-text" x="900" y="461" font-size="18" text-anchor="middle" font-weight="700" fill="#5b4fc4" fill-opacity="1">Laszlo (later work)</text>
  <text x="540" y="558" font-size="22" text-anchor="middle" font-weight="700" fill="currentColor" fill-opacity="1">The explanatory price each must pay</text>
  <rect x="60" y="590" width="220" height="90" rx="12" style="fill: var(--bg, #fff)" stroke="#5b4fc4" stroke-opacity=".5" stroke-width="2.5"/>
  <text x="170" y="630" font-size="16" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity="1">Where does subjective</text>
  <text x="170" y="651" font-size="16" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity="1">experience come from?</text>
  <rect x="300" y="590" width="220" height="90" rx="12" style="fill: var(--bg, #fff)" stroke="#5b4fc4" stroke-opacity=".5" stroke-width="2.5"/>
  <text x="410" y="630" font-size="16" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity="1">Why do the two faces</text>
  <text x="410" y="651" font-size="16" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity="1">correspond so neatly?</text>
  <rect x="540" y="590" width="220" height="90" rx="12" style="fill: var(--bg, #fff)" stroke="#5b4fc4" stroke-opacity=".5" stroke-width="2.5"/>
  <text x="650" y="619" font-size="16" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity="1">Combination problem: how</text>
  <text x="650" y="640" font-size="16" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity="1">do micro-experiences</text>
  <text x="650" y="661" font-size="16" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity="1">make an “I”?</text>
  <rect x="780" y="590" width="220" height="90" rx="12" style="fill: var(--bg, #fff)" stroke="#5b4fc4" stroke-opacity=".5" stroke-width="2.5"/>
  <text x="890" y="619" font-size="16" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity="1">Decombination problem;</text>
  <text x="890" y="640" font-size="16" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity="1">why are physical laws</text>
  <text x="890" y="661" font-size="16" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity="1">so stable?</text>
</svg>
