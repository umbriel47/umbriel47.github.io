<svg class="chart" viewBox="0 0 1080 810" role="img" aria-label="MHS layers: safety limits are enforced at the device layer" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>MHS layers: safety limits are enforced at the device layer</title>
  <text x="36" y="44" font-size="19" text-anchor="start" font-weight="600" fill="currentColor" fill-opacity="1">MHS layers: safety limits are enforced at the device layer</text>
  <rect x="36" y="76" width="1008" height="80" rx="10" fill="none" fill-opacity="0" stroke="currentColor" stroke-opacity=".25" stroke-width="1.5"/>
  <text x="540" y="108" font-size="17" text-anchor="middle" font-weight="600" fill="currentColor" fill-opacity="1">Agent (Claude, or any model's agent harness)</text>
  <text x="540" y="136" font-size="14" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity=".7">Reasons, plans, reads data, adjusts parameters live; can pause for human confirmation before a risky action</text>
  <line x1="196" y1="156" x2="196" y2="176" stroke="currentColor" stroke-opacity=".35" stroke-width="1.5"/>
  <path d="M196 182 l-5 -8 h10 z" fill="currentColor" fill-opacity=".35"/>
  <rect x="36" y="182" width="320" height="90" rx="10" fill="none" fill-opacity="0" stroke="currentColor" stroke-opacity=".25" stroke-width="1.5"/>
  <text x="196" y="218" font-size="17" text-anchor="middle" font-weight="600" fill="currentColor" fill-opacity="1">MCP</text>
  <text x="196" y="248" font-size="14" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity=".7">Step-by-step calls, interactive exploration</text>
  <line x1="540" y1="156" x2="540" y2="176" stroke="currentColor" stroke-opacity=".35" stroke-width="1.5"/>
  <path d="M540 182 l-5 -8 h10 z" fill="currentColor" fill-opacity=".35"/>
  <rect x="380" y="182" width="320" height="90" rx="10" fill="none" fill-opacity="0" stroke="currentColor" stroke-opacity=".25" stroke-width="1.5"/>
  <text x="540" y="218" font-size="17" text-anchor="middle" font-weight="600" fill="currentColor" fill-opacity="1">Command line (CLI)</text>
  <text x="540" y="248" font-size="14" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity=".7">Scripted operation and debugging</text>
  <line x1="884" y1="156" x2="884" y2="176" stroke="currentColor" stroke-opacity=".35" stroke-width="1.5"/>
  <path d="M884 182 l-5 -8 h10 z" fill="currentColor" fill-opacity=".35"/>
  <rect x="724" y="182" width="320" height="90" rx="10" fill="none" fill-opacity="0" stroke="currentColor" stroke-opacity=".25" stroke-width="1.5"/>
  <text x="884" y="218" font-size="17" text-anchor="middle" font-weight="600" fill="currentColor" fill-opacity="1">Code files (API)</text>
  <text x="884" y="248" font-size="14" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity=".7">Chain multi-device commands for long runs</text>
  <line x1="196" y1="272" x2="196" y2="300" stroke="currentColor" stroke-opacity=".35" stroke-width="1.5"/>
  <path d="M196 306 l-5 -8 h10 z" fill="currentColor" fill-opacity=".35"/>
  <line x1="540" y1="272" x2="540" y2="300" stroke="currentColor" stroke-opacity=".35" stroke-width="1.5"/>
  <path d="M540 306 l-5 -8 h10 z" fill="currentColor" fill-opacity=".35"/>
  <line x1="884" y1="272" x2="884" y2="300" stroke="currentColor" stroke-opacity=".35" stroke-width="1.5"/>
  <path d="M884 306 l-5 -8 h10 z" fill="currentColor" fill-opacity=".35"/>
  <rect x="36" y="306" width="1008" height="170" rx="10" fill="#2274bd" fill-opacity=".08" stroke="#2274bd" stroke-opacity="1" stroke-width="2.5"/>
  <text x="58" y="342" font-size="17" text-anchor="start" font-weight="600" fill="currentColor" fill-opacity="1">MHS standard driver (core layer)</text>
  <text x="58" y="376" font-size="15" text-anchor="start" font-weight="400" fill="currentColor" fill-opacity="1">A small set of primitives, e.g. read (read temperature), write (set temperature)</text>
  <text x="58" y="402" font-size="15" text-anchor="start" font-weight="400" fill="currentColor" fill-opacity="1">Standardised discovery + MHS state dictionary: device data shared by many programs</text>
  <text x="58" y="428" font-size="15" text-anchor="start" font-weight="400" fill="currentColor" fill-opacity="1">Natural-language tags → reference file: what it measures, what it adjusts, its safety limits</text>
  <text x="58" y="454" font-size="15" text-anchor="start" font-weight="400" fill="currentColor" fill-opacity="1">Device-level safety limits: commands beyond the vendor's spec are blocked before execution</text>
  <line x1="540" y1="476" x2="540" y2="504" stroke="currentColor" stroke-opacity=".35" stroke-width="1.5"/>
  <path d="M540 510 l-5 -8 h10 z" fill="currentColor" fill-opacity=".35"/>
  <rect x="36" y="510" width="1008" height="80" rx="10" fill="none" fill-opacity="0" stroke="currentColor" stroke-opacity=".25" stroke-width="1.5"/>
  <text x="540" y="543" font-size="17" text-anchor="middle" font-weight="600" fill="currentColor" fill-opacity="1">Vendor native interfaces</text>
  <text x="540" y="572" font-size="14" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity=".7">SDKs, APIs, etc.; an instrument with no API can be driven through its GUI for now (the CMU case)</text>
  <line x1="540" y1="590" x2="540" y2="618" stroke="currentColor" stroke-opacity=".35" stroke-width="1.5"/>
  <path d="M540 624 l-5 -8 h10 z" fill="currentColor" fill-opacity=".35"/>
  <rect x="36" y="624" width="1008" height="128" rx="10" fill="none" fill-opacity="0" stroke="currentColor" stroke-opacity=".25" stroke-width="1.5"/>
  <text x="58" y="656" font-size="17" text-anchor="start" font-weight="600" fill="currentColor" fill-opacity="1">Physical devices</text>
  <rect x="58" y="674" width="142" height="58" rx="10" fill="none" fill-opacity="0" stroke="currentColor" stroke-opacity=".3" stroke-width="1.5"/>
  <text x="129" y="709" font-size="15" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity="1">Liquid handler</text>
  <rect x="222" y="674" width="142" height="58" rx="10" fill="none" fill-opacity="0" stroke="currentColor" stroke-opacity=".3" stroke-width="1.5"/>
  <text x="293" y="709" font-size="15" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity="1">Plate reader</text>
  <rect x="386" y="674" width="142" height="58" rx="10" fill="none" fill-opacity="0" stroke="currentColor" stroke-opacity=".3" stroke-width="1.5"/>
  <text x="457" y="709" font-size="15" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity="1">Robot arm</text>
  <rect x="550" y="674" width="142" height="58" rx="10" fill="none" fill-opacity="0" stroke="currentColor" stroke-opacity=".3" stroke-width="1.5"/>
  <text x="621" y="709" font-size="15" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity="1">Microscope</text>
  <rect x="714" y="674" width="142" height="58" rx="10" fill="none" fill-opacity="0" stroke="currentColor" stroke-opacity=".3" stroke-width="1.5"/>
  <text x="785" y="709" font-size="15" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity="1">Lasers &amp; optics</text>
  <rect x="878" y="674" width="142" height="58" rx="10" fill="none" fill-opacity="0" stroke="currentColor" stroke-opacity=".3" stroke-width="1.5"/>
  <text x="949" y="709" font-size="15" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity="1">qPCR / camera</text>
  <text x="36" y="790" font-size="14" text-anchor="start" font-weight="400" fill="currentColor" fill-opacity=".6">Long runs are chained in code and devices run at native speed; the agent steps in only where reasoning is needed</text>
</svg>
