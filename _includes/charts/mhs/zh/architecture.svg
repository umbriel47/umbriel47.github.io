  <path d="M884 306 l-5 -8 h10 z" fill="currentColor" fill-opacity=".35"/>
  <rect x="36" y="306" width="1008" height="170" rx="10" fill="#2274bd" fill-opacity=".08" stroke="#2274bd" stroke-opacity="1" stroke-width="2.5"/>
  <text x="58" y="342" font-size="17" text-anchor="start" font-weight="600" fill="currentColor" fill-opacity="1">MHS 标准驱动（核心层）</text>
  <text x="58" y="376" font-size="15" text-anchor="start" font-weight="400" fill="currentColor" fill-opacity="1">一小组原语，如 read（读取温度）、write（设定温度）</text>
  <text x="58" y="402" font-size="15" text-anchor="start" font-weight="400" fill="currentColor" fill-opacity="1">标准化发现 + MHS 状态字典：多程序共享读写设备数据</text>
