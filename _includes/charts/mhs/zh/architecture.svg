  <text x="884" y="218" font-size="17" text-anchor="middle" font-weight="600" fill="currentColor" fill-opacity="1">代码文件（API）</text>
  <text x="884" y="248" font-size="14" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity=".7">串联多设备指令，跑长任务</text>
