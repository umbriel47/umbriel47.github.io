  <rect x="714" y="674" width="142" height="58" rx="10" fill="none" fill-opacity="0" stroke="currentColor" stroke-opacity=".3" stroke-width="1.5"/>
  <text x="785" y="709" font-size="15" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity="1">激光与光学</text>
  <rect x="878" y="674" width="142" height="58" rx="10" fill="none" fill-opacity="0" stroke="currentColor" stroke-opacity=".3" stroke-width="1.5"/>
  <text x="949" y="709" font-size="15" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity="1">qPCR / 相机</text>
  <text x="36" y="790" font-size="14" text-anchor="start" font-weight="400" fill="currentColor" fill-opacity=".6">长任务由代码串联、设备以原生速度执行；智能体只在需要推理的节点介入</text>
