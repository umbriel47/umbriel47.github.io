  <text x="540" y="136" font-size="14" text-anchor="middle" font-weight="400" fill="currentColor" fill-opacity=".7">推理、规划、读取数据、实时改参数；遇到风险操作可暂停等待人工确认</text>
  <line x1="196" y1="156" x2="196" y2="176" stroke="currentColor" stroke-opacity=".35" stroke-width="1.5"/>
