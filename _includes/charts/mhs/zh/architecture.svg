<svg class="chart" viewBox="0 0 1080 810" role="img" aria-label="MHS 分层架构：安全限值在设备层强制执行" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>MHS 分层架构：安全限值在设备层强制执行</title>
  <text x="36" y="44" font-size="19" text-anchor="start" font-weight="600" fill="currentColor" fill-opacity="1">MHS 分层架构：安全限值在设备层强制执行</text>
