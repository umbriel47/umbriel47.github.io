<svg class="chart" viewBox="0 0 1080 1402" role="img" aria-label="机器与数学证明：七十年时间线" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
