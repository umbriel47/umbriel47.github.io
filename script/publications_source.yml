# Curated publication list -- the input to script/sync_publications.py.
#
# This file is hand-maintained; _data/publications.yml is generated from it.
# To add a paper: append an entry with at least key / year / kind / authors /
# title / venue / venue_zh, then run:
#
#     python3 script/sync_publications.py
#
# The script fills in the abstract and the link. Give it a `doi`, `arxiv` or
# `openreview` hint when you have one; without a hint it searches PubMed,
# Crossref and arXiv by title, and reports anything it cannot resolve.
#
# kind: journal  -> the link is labelled "Journal"
#       preprint -> labelled "Preprint"
# preprint_url: an extra preprint link shown alongside a journal link.

